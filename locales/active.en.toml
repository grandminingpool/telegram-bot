Language = "🇬🇧 English"

BotDescription = "Hello!\n\nI'm a Grand Pool mining monitoring bot. I'll help you to track mining process, payouts, show pool statistics and notify you when your mining devices are idle."

DefaultMessage = "Select command from pool bot menu"

FAQMessage = "<b>How to start?</b>\nAdd a new wallet that you are using for mining on Grand Pool ({{.PoolURL}}) via \"Add wallet\" menu. After that you will be able to check your balance statistics in \"Wallets\" and detailed workers statistics in \"Workers\".\n\n<b>Notifications</b>\nBot will send you a notification in the following cases:\n1. One of your workers is idle for ~{{.CheckWorkersInterval}} minutes;\n2. A new payout received from the pool;\n3. Your workers found a new block.\n\nSomething works wrong or you have any questions? Feel free to join our chat: {{.PoolChatLink}}"

ReportBugMessage = "Tell us, what happened?"

