BotDescription = "Привет!\n\nЯ бот для мониторинга майнинга на Grand Pool. Помогу отслеживать процесс майнинга, выплаты, покажу статистику пула и пришлю увдомление, когда ваши устройства простаивают."

DefaultMessage = "Выберите команду из меню бота"

FAQMessage = "<b>Как начать?</b>\nДобавьте кошелёк, который вы используете для майнинга на Grand Pool ({{.PoolURL}}), через меню «Добавить кошелёк». После этого вы сможете проверять баланс в разделе «Кошельки» и подробную статистику воркеров в разделе «Воркеры».\n\n<b>Уведомления</b>\nБот отправит вам уведомление в следующих случаях:\n1. Один из ваших воркеров простаивает более ~{{.CheckWorkersInterval}} минут;\n2. Получена новая выплата от пула;\n3. Ваши воркеры нашли новый блок.\n\nЧто-то не работает или есть вопросы? Присоединяйтесь к нашему чату: {{.PoolChatLink}}"

