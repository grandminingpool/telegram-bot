BotDescription = "¡Hola!\n\nSoy un bot de monitoreo de minería de Grand Pool. Te ayudaré a rastrear el proceso de minería, pagos, mostrar estadísticas del pool y notificarte cuando tus dispositivos estén inactivos."

DefaultMessage = "Selecciona un comando del menú del bot"

FAQMessage = "<b>¿Cómo empezar?</b>\nAgrega una billetera que estés usando para minar en Grand Pool ({{.PoolURL}}) a través del menú «Agregar billetera». Después podrás consultar tu balance en «Billeteras» y las estadísticas detalladas de workers en «Workers».\n\n<b>Notificaciones</b>\nEl bot te enviará una notificación en los siguientes casos:\n1. Uno de tus workers está inactivo durante ~{{.CheckWorkersInterval}} minutos;\n2. Se recibió un nuevo pago del pool;\n3. Tus workers encontraron un nuevo bloque.\n\n¿Algo no funciona o tienes preguntas? Únete a nuestro chat: {{.PoolChatLink}}"

